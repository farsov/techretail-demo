# CI de cada Pull Request hacia main. El job `ci` es el check que exige la regla main-protegida.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend · build y pruebas
        working-directory: backend
        run: mvn -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend · dependencias
        working-directory: frontend
        run: npm ci

      - name: Frontend · formato
        working-directory: frontend
        run: npx prettier --check --no-error-on-unmatched-pattern src e2e playwright.config.ts

      - name: Frontend · pruebas
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Frontend · build
        working-directory: frontend
        run: npx ng build

      - name: Playwright · las pruebas E2E se listan
        working-directory: frontend
        run: npx playwright test --list

      - name: Imágenes · se construyen sin publicarse
        run: |
          docker build -t app-backend:ci backend
          docker build -t app-frontend:ci frontend
