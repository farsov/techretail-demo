spring.application.name=app-backend
# Sin DB_URL usa una base en memoria (desarrollo y pruebas); en la nube se define DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:app;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
management.endpoints.web.exposure.include=health
# Autenticación: dev (por defecto) firma y valida tokens en local con /api/dev/token; la del IdP de producción está pendiente.
auth.modo=${AUTH_MODO:dev}
