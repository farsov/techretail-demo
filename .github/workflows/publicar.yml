# Al fusionar en main: publica las imágenes del backend y del frontend en Azure Container Registry.
# Credenciales: secrets ACR_LOGIN_SERVER, ACR_USERNAME y ACR_PASSWORD (los crea el bootstrap de la fábrica).
name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Comprobar los secrets del registro
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          faltan=""
          [ -n "$ACR_LOGIN_SERVER" ] || faltan="$faltan ACR_LOGIN_SERVER"
          [ -n "$ACR_USERNAME" ] || faltan="$faltan ACR_USERNAME"
          [ -n "$ACR_PASSWORD" ] || faltan="$faltan ACR_PASSWORD"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan los secrets$faltan. Ejecuta el bootstrap de Azure de la fábrica (infra/bootstrap-azure)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Nombres y etiquetas
        id: meta
        run: |
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Backend · construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ steps.meta.outputs.repo }}-backend:${{ steps.meta.outputs.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ steps.meta.outputs.repo }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend · construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ steps.meta.outputs.repo }}-frontend:${{ steps.meta.outputs.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ steps.meta.outputs.repo }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Resumen
        run: |
          {
            echo "### Imágenes publicadas"
            echo "- \`${{ steps.meta.outputs.repo }}-backend:${{ steps.meta.outputs.sha }}\`"
            echo "- \`${{ steps.meta.outputs.repo }}-frontend:${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
